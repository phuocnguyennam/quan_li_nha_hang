apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-infrastructure-projects
  namespace: argocd
  annotations:
    argocd.argoproj.github.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: 'https://github.com/phuocnguyennam/quan_li_nha_hang.git'
    targetRevision: main
    path: k8s/deploy/argocd/projects
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-infrastructure-applicationsets
  namespace: argocd
  annotations:
    argocd.argoproj.github.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: 'https://github.com/phuocnguyennam/quan_li_nha_hang.git'
    targetRevision: main
    path: k8s/deploy/argocd/applicationsets
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
