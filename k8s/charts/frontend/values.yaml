replicaCount: 1

image:
  repository: ghcr.io/phuocnguyennam/restaurant-frontend
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets:
  - name: ghcr-pull-secret

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: "nginx"
  annotations: {}
  hosts:
    - host: rms.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

# Frontend có thể cần cấu hình URL API cho browser gọi API ở Client side
env:
  apiUrl: "http://api.local"

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
