replicaCount: 2

image:
  tag: "latest"

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: phuocnguyen.dpdns.org
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: restaurant-frontend-tls
      hosts:
        - phuocnguyen.dpdns.org

env:
  apiUrl: "https://api.phuocnguyen.dpdns.org"
